[project]
authors = [{name = "maphew", email = "maphew@gmail.com"}]
dependencies = []
description = 'An interface for "interesting folders" in the filesystem'
name = "zinfo"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
zinfo = { path = ".", editable = true }

