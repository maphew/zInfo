[project]
name = "zinfo"
version = "0.1.0"
description = 'An interface for "interesting folders" in the filesystem'
authors = [{name = "maphew", email = "maphew@gmail.com"}]

requires-python = ">= 3.11"
dependencies = [
    "click",
    "python-fasthtml>=0.12.29",
]

[project.optional-dependencies]
dev = [
    "black>=25.9.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.1",
]

[project.scripts]
zinfo = "zinfo.cli:main"
zinfo-gui = "zinfo.ui.main:main"

[project.urls]
Homepage = "https://github.com/maphew/zinfo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=zinfo --cov-report=term-missing"
markers = []

[tool.uv]
package = true

[tool.uv.sources]
zinfo = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"
