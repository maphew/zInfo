[project]
authors = [{name = "maphew", email = "maphew@gmail.com"}]
description = 'An interface for "interesting folders" in the filesystem'
name = "zinfo"
packages = [{include = "zinfo", from = "src"}]
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
    "click",
]

[project.scripts]
zinfo = "zinfo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=zinfo --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"
