[project]
authors = [{name = "maphew", email = "maphew@gmail.com"}]
description = 'An interface for "interesting folders" in the filesystem'
name = "zinfo"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
    "click",
    "marimo",
    "pytest",
    "pytest-cov",
    "pip"
]

[project.scripts]
zinfo = "zinfo.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zinfo", "zinfo.core"]
package-dir = {"" = "src"}

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
marimo = ">=0.10.7,<0.11"
pytest = "*"
pytest-cov = "*"
pip = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=zinfo --cov-report=term-missing"

[tool.pixi.tasks]
test = { cmd = "pytest" }
install-dev = { cmd = "python -m pip install -e ." }
